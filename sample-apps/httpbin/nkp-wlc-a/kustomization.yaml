apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
 - ../base

patches:
- target:
    kind: Ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: "httpbin.10.38.48.141.nip.io"
    - op: replace
      path: /spec/tls/0/hosts
      value: ["httpbin.10.38.48.141.nip.io"]
# - target:
#     kind: Deployment
#   patch: |-
# #     - op: replace 
# #       path: /spec/template/spec/containers/0/image
# #       value: "docker.io/kennethreitz/httpbin:v2"
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2