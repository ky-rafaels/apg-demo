#cloud-config
hostname: nkp-nai-cp-01
fqdn: nkp-nai-cp-01.yourdomain.local
manage_etc_hosts: true
preserve_hostname: false
users:
  - name: nutanix 
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: "nutanix/4u"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEX7AWYR0QYe1Q74rrQcqjAq7wcNotSjPWAxqoYfXdCX kylerafaels@MacBookPro.lan 
ssh_pwauth: true
disable_root: false
swap:
  filename: /swap.img
  size: "0"
runcmd:
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  - sudo modprobe overlay
  - sudo modprobe br_netfilter
  - echo "overlay" | sudo tee /etc/modules-load.d/k8s.conf
  - echo "br_netfilter" | sudo tee -a /etc/modules-load.d/k8s.conf
  - echo "net.bridge.bridge-nf-call-iptables = 1" | sudo tee /etc/sysctl.d/k8s.conf
  - echo "net.bridge.bridge-nf-call-ip6tables = 1" | sudo tee -a /etc/sysctl.d/k8s.conf
  - echo "net.ipv4.ip_forward = 1" | sudo tee -a /etc/sysctl.d/k8s.conf
  - sudo sysctl --system &>/dev/null
  - sudo ufw disable
  - rm -f /etc/machine-id
  - systemd-machine-id-setup
  - rm -f /etc/ssh/ssh_host_*
  - ssh-keygen -A
  - systemctl restart ssh
final_message: "Node nkp-nai-cp-01 base provisioning complete after $UPTIME seconds"